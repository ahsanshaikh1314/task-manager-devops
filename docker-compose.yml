services:

  mongodb:
    image: mongo:7.0
    container_name: taskmanager-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: taskmanager
    networks:
      - taskmanager-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: taskmanager-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/taskmanager
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskmanager-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: taskmanager-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - taskmanager-network

volumes:
  mongodb_data:

networks:
  taskmanager-network:
    driver: bridge